[package]
name = "cogneurs-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
cogneurs-engine = { path = "../engine" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "signal", "process", "io-util", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
